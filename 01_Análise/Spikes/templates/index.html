<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Processos Crime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container mt-5">
    <div class="text-center mb-4">
        <h1>Upload de Processos Crime</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="fileInput" class="form-label">Escolha os ficheiros</label>
                    <input type="file" class="form-control" id="fileInput" name="files[]" multiple required>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h2>Ficheiros:</h2>
            <ul class="list-group">
                {% for file in files %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ file }}
                        {% if file.endswith('.docx') %}
                            <form action="{{ url_for('ler_docx', filename=file) }}" method="get" style="display:inline;">
                                <button type="submit" class="btn btn-info btn-sm">Ler</button>
                            </form>
                        {% endif %}
                    </li>
                {% else %}
                    <li class="list-group-item">Não existem ficheiros carregados.</li>
                {% endfor %}
            </ul>
        </div>
    </div>

    {% if content %}
        <div class="card mt-4">
            <div class="card-body">
                <h2>Conteúdo do ficheiro: "{{ filename }}":</h2>
                <pre style="white-space: pre-wrap; background: #f4f4f4; padding: 10px; border: 1px solid #ccc; 
                           width: 100%; height: 500px; overflow: auto;">{{ content }}
                </pre>
            </div>
        </div>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

</body>
</html>
