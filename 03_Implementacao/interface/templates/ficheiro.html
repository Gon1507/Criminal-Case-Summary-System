<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>{{ filename }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light text-dark">

<div class="container py-5">
  <div class="text-center mb-4">
    <h2 class="fw-semibold">{{ filename }}</h2>
  </div>

  <div class="mb-4">
    <textarea name="nova_resposta" class="form-control" rows="25" style="font-family: monospace;">{{ conteudo }}</textarea>
  </div>

  <div class="d-flex justify-content-center gap-3">
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">Voltar</a>

    <form action="{{ url_for('main.apagar_ficheiro', filename=filename) }}" method="POST"
          onsubmit="return confirm('Tem a certeza que deseja apagar este ficheiro?');">
      <button type="submit" class="btn btn-danger">Apagar Ficheiro</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
