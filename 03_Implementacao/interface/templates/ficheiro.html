<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>{{ filename }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        
    </style>
</head>
<body>

<div class="wrapper">
    <h4 class="mb-3">{{ filename }}</h4>
    <div class="scroll-box">
        {{ conteudo }}
    </div>
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary mb-3" onclick="window.close()">Voltar</a>
    <form action="{{ url_for('main.apagar_ficheiro', filename=filename) }}" method="POST" onsubmit="return confirm('Tem a certeza que deseja apagar este ficheiro?'); window.close() ">
    <button type="submit" class="btn btn-danger mb-3">Apagar Ficheiro</button>
</form>
</div>

</body>
</html>
