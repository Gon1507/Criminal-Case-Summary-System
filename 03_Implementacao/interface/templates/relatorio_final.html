<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Relatório Final</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrapper">
    <h4 class="mb-3">Relatório Final</h4>
    <form method="POST" action="{{ url_for('main.editar_chron') }}">
        <div class="scroll-box mb-3">
            <textarea name="nova_resposta" class="form-control" rows="20" style="font-family: monospace;">{{ resposta }}</textarea>
        </div>
        <div class="d-flex gap-3 mt-3">
            <button type="submit" class="btn btn-primary">Guardar Alterações</button>
            <a href="{{ url_for('main.download_word') }}" class="btn btn-secondary">Download Word</a>
            <button type="button" class="btn btn-outline-primary" onclick="window.close()">Fechar</button>
        </div>
    </form>
</div>
</body>
</html>
