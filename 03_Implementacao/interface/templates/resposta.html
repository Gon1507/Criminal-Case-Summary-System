<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Resposta - {{ filename }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrapper">
    <h4 class="mb-3">{{ filename }}</h4>
    <form method="POST" action="{{ url_for('main.editar_resposta', filename=filename) }}">
        <div class="scroll-box mb-3">
            <textarea name="nova_resposta" class="form-control" rows="20" style="font-family: monospace;">{{ resposta }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Alterações</button>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary" onclick="window.close()">Voltar</a>
    </form>
    
</div>
</body>
</html>
